name: ContentStationWall
options:
  bundleIdPrefix: com.contentstation
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  xcodeVersion: "26.0"
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "9"
    DEVELOPMENT_TEAM: HP284BJ924
    CODE_SIGN_STYLE: Automatic
targets:
  ContentStationWall:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ContentStation Wall
        CFBundleName: ContentStationWall
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSCameraUsageDescription: The wall camera films the work area so clips can be made for the shop.
        NSLocalNetworkUsageDescription: Used to join the shop Wi-Fi network during pairing.
        UIBackgroundModes:
          - processing
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - ai.contentstation.wall.maintenance
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        CS_API_BASE_URL: $(CS_API_BASE_URL)
    entitlements:
      path: ContentStationWall.entitlements
      properties:
        com.apple.developer.networking.HotspotConfiguration: true
    settings:
      configs:
        Debug:
          INFOPLIST_FILE: Info-Debug.plist
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.contentstation.station
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        SUPPORTS_MACCATALYST: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  ContentStationWall:
    build:
      targets:
        ContentStationWall: all
    run:
      config: Debug
      commandLineArguments:
        "-CS_PREVIEW_STATE waiting": false
        "-CS_PREVIEW_STATE reading": false
        "-CS_PREVIEW_STATE connecting": false
        "-CS_PREVIEW_STATE framing": false
        "-CS_PREVIEW_STATE recording": false
        "-CS_PREVIEW_STATE paused": false
        "-CS_PREVIEW_STATE nointernet": false
        "-CS_PREVIEW_STATE nointernet_long": false
        "-CS_PREVIEW_STATE reframe": false
        "-CS_PREVIEW_STATE hot": false
        "-CS_PREVIEW_STATE fault": false
        "-CS_MOCK_API 1": false
    archive:
      config: Release
